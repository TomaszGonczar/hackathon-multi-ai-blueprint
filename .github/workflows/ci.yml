name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every relative Markdown link resolves
        run: python3 .github/scripts/check_links.py

  seed:
    name: Seed end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck seed/bootstrap.sh seed/verify.sh seed/templates/check.sh.example

      # bootstrap.sh writes five worktrees into $HOME, so every step gets a throwaway one.
      - name: bootstrap.sh + all ten checks, run twice
        run: |
          export HOME="$(mktemp -d)"
          bash seed/bootstrap.sh
          bash seed/verify.sh
          echo "--- second run: must be idempotent ---"
          bash seed/bootstrap.sh > /dev/null
          bash seed/verify.sh

      # A check that cannot fail checks nothing. Each case below breaks one thing
      # the seed guarantees and expects a red result.
      - name: "Must fail: verify.sh catches a vacuous merge gate"
        run: |
          export HOME="$(mktemp -d)"
          bash seed/bootstrap.sh > /dev/null
          git -C "$HOME/w2-piece" reset -q --hard HEAD~1   # drop w2's start marker
          if bash seed/verify.sh; then
            echo "::error::verify.sh passed although w2 looks merged before any merge"
            exit 1
          fi

      - name: "Must fail: verify.sh catches a disabled secrets gate"
        run: |
          export HOME="$(mktemp -d)"
          bash seed/bootstrap.sh > /dev/null
          sed -i 's/^  if git diff --cached | grep -nEi .*; then$/  if false; then/' "$HOME/w1-piece/check.sh"
          grep -q '^  if false; then$' "$HOME/w1-piece/check.sh"   # the sabotage really applied
          if bash seed/verify.sh; then
            echo "::error::verify.sh passed although the secrets gate is disabled"
            exit 1
          fi

      - name: "Must fail: bootstrap.sh exits 1 when a worktree cannot be created"
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/w3-piece" && touch "$HOME/w3-piece/in-the-way"
          if bash seed/bootstrap.sh; then
            echo "::error::bootstrap.sh reported success with ~/w3-piece blocked"
            exit 1
          fi
